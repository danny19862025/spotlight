name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libsqlite3-dev ripgrep gzip libvips-tools ffmpeg zbar-tools poppler-utils gnupg python3-gi python3-gi-cairo gir1.2-gtk-4.0 tesseract-ocr dbus xvfb xauth
      - name: Install stable Rust with lint tools
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 tests/browser_data_test.py
      - run: python3 tests/systemtools_smoke.py
      - run: cargo build --release --locked
      # Smoke tests that need only a virtual display and private D-Bus.
      # calendar_backend, freebusy, productivity, workflow, plus, superpowers
      # and window_controls need KDE/Evolution services and stay manual.
      - name: Smoke tests
        run: |
          for test in deep_features boosters calendar devkit devtools features \
              folder_open guide interface music search usability; do
            echo "::group::$test"
            xvfb-run -a python3 "tests/${test}_smoke.py"
            echo "::endgroup::"
          done
