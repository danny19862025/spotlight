[package]
name = "spotlight"
version = "0.1.0"
edition = "2024"
description = "A keyboard-first native Linux productivity launcher"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "2.0", default-features = false, features = ["stable", "std", "validate", "extra-checks", "portable-dispatch"] }

[dev-dependencies]
wat = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
